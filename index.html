<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- 1. Redirecionamento instantâneo via Meta Tag (substitua a URL abaixo) -->
  <meta http-equiv="refresh" content="0; url=https://brelectionsim.pages.dev">
  <link rel="canonical" href="https://brelectionsim.pages.dev" />
  <title>Redirecionando...</title>
  
  <!-- 2. Fallback via JavaScript -->
  <script>
    window.location.href = "https://brelectionsim.pages.dev";
  </script>
</head>
<body>
  <p>Se você não for redirecionado automaticamente, <a href="https://brelectionsim.pages.dev">clique aqui</a>.</p>
</body>
</html>
