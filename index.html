<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eleições View - 2026 Final c/ Regiões Metropolitanas</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,800;0,900;1,400&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<!-- Export Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style id="global-styles">
/* ESTILOS GERAIS DO APP - MANTIDOS DA VERSÃO ANTERIOR OTIMIZADA */
:root {
  --bg-primary: #0a0c10;
  --bg-secondary: #111827;
  --bg-card: rgba(17, 24, 39, 0.95);
  --accent-blue: #3b82f6;
  --accent-purple: #8b5cf6;
  --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
  --gradient-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  --text-primary: #ffffff;
  --text-secondary: #e2e8f0;
  --text-muted: #94a3b8;
  --border-color: rgba(255, 255, 255, 0.1);
  --sidebar-width: 380px;
}
* { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow: hidden; height: 100vh; width: 100vw; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 9999px; }
::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--accent-blue), var(--accent-purple)); border-radius: 9999px; }
#app { width: 100%; height: 100%; display: flex; position: relative; background: var(--bg-secondary); overflow: hidden; }
#map { flex: 1; height: 100%; z-index: 1; position: relative; }
.sidebar, .sidebar-right { width: var(--sidebar-width); min-width: var(--sidebar-width); background: var(--bg-card); backdrop-filter: blur(10px); display: flex; flex-direction: column; z-index: 100; border-right: 1px solid var(--border-color); height: 100%; transition: all 0.3s; }
.sidebar-right { border-left: 1px solid var(--border-color); border-right: none; }
.header { padding: 20px; background: var(--gradient-dark); border-bottom: 1px solid var(--border-color); flex-shrink: 0; position: relative; }
.header h1, .header h2 { font-size: 1.4rem; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.controls { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.btn-io { flex: 1; min-width: 80px; padding: 10px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(15, 23, 42, 0.8); color: var(--text-secondary); border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-io:hover { background: rgba(30, 41, 59, 0.9); border-color: var(--accent-blue); transform: translateY(-2px); }
.btn-primary, .btn-secondary, .btn-back { width: 100%; padding: 16px; border-radius: 8px; font-weight: 700; color: white; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.btn-primary { background: var(--gradient-primary); border: none; text-transform: uppercase; justify-content: center; }
.btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.85rem; }
.btn-back { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); justify-content: center; margin-bottom: 20px;}
.mode-tabs { display: flex; gap: 10px; margin-top: 20px; background: rgba(15, 23, 42, 0.5); padding: 6px; border-radius: 8px; }
.mode-tab { flex: 1; padding: 12px; text-align: center; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
.mode-tab.active { background: var(--gradient-primary); color: white; }
select, input[type="range"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background-color: rgba(15, 23, 42, 0.8); color: white; }
.slider-box { margin-bottom: 16px; background: rgba(15, 23, 42, 0.3); padding: 15px; border-radius: 8px; }
.slider-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 12px; align-items: center; }
input[type="range"] { padding: 10px 0; -webkit-appearance: none; background: transparent; border: none;}
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 22px; width: 22px; background: var(--gradient-primary); border-radius: 50%; border: 2px solid white; margin-top: -8px;}
input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px;}
.cand-row { display: flex; align-items: center; gap: 12px; padding: 16px; margin-bottom: 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; }
.cand-color { width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; }
.cand-info { flex: 1; }
.cand-head { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; }
.progress-bar { height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 10px; transition: width 0.8s; }
.map-controls { position: absolute; top: 25px; right: 410px; display: flex; flex-direction: column; gap: 10px; z-index: 900; }
.map-btn { width: 48px; height: 48px; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; font-size: 1.3rem; }
.legend { position: absolute; bottom: 30px; right: 410px; background: rgba(15, 23, 42, 0.9); padding: 20px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; z-index: 900; }
.legend-grid { display: flex; height: 24px; width: 250px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
.legend-item { flex: 1; }
.custom-tooltip { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 8px; padding: 0; }
.tt-head { background: rgba(30, 41, 59, 0.9); padding: 12px 16px; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
.tt-body { padding: 12px 16px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 6000; display: none; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-content { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); width: 520px; max-height: 85vh; border-radius: 16px; display: flex; flex-direction: column; }
.modal-header, .modal-footer { padding: 20px; background: rgba(30, 41, 59, 0.8); }
.modal-header { border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; }
.modal-body { padding: 24px; overflow-y: auto; flex: 1; }
.modal-footer { border-top: 1px solid rgba(255, 255, 255, 0.1); text-align: right; }
#loader { position: fixed; inset: 0; background: rgba(5, 5, 5, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.hidden { opacity: 0; pointer-events: none; display: none !important; }
.spinner { width: 60px; height: 60px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.mobile-nav { display: none; }
@media (max-width: 768px) {
  #app { display: block; }
  #map { padding-bottom: 70px; }
  .mobile-nav { display: flex; position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.95); z-index: 5000; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.75rem; gap: 6px; }
  .nav-item.active { color: var(--accent-blue); }
  .sidebar, .sidebar-right { position: absolute; bottom: 70px; width: 100%; height: auto; max-height: 85vh; transform: translateY(110%); z-index: 4000; }
  .sidebar.active, .sidebar-right.active { transform: translateY(0); }
  .map-controls { right: 20px; top: 20px; flex-direction: row; }
  .legend { display: none; }
}
</style>

<style id="presentation-styles">
    /* =========================================================
       ESTILOS EXCLUSIVOS DA APRESENTAÇÃO (MATCH COM A IMAGEM)
    ========================================================= */
    #presentationOverlay {
        position: fixed; inset: 0; width: 100vw; height: 100vh;
        background-color: #0d102e; /* Fundo azul escuro clássico */
        z-index: 999999; display: none; flex-direction: column; 
        color: #ffffff; font-family: 'Montserrat', sans-serif; overflow: hidden;
    }
    
    /* Marca d'água no fundo simulando identidade visual da eleição */
    #presentationOverlay::before {
        content: 'ELEIÇÕES 2026';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 12vw;
        font-weight: 900;
        color: rgba(255,255,255,0.02);
        white-space: nowrap;
        pointer-events: none;
        z-index: 1;
        letter-spacing: 15px;
    }
    
    /* Ruído fino simulando painel digital */
    #presentationOverlay::after {
        content: ''; position: absolute; inset: 0;
        background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
        pointer-events: none; z-index: 2;
    }

    #presentationOverlay.active { display: flex; }
    
    /* HEADER (Brasão, 2026, Bandeira) */
    .pres-header { 
        padding: 30px 60px; position: relative; z-index: 10; 
        display: flex; justify-content: space-between; align-items: flex-start;
    }
    .pres-header-side {
        width: 150px; height: 80px;
        display: flex; align-items: center; justify-content: center;
    }
    .pres-header-side img { max-height: 100%; max-width: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
    
    .pres-header-center { text-align: center; display: flex; flex-direction: column; align-items: center; }
    
    .pres-year { 
        font-size: 3.5rem; font-weight: 900; line-height: 1;
        background: #d4a017; /* Dourado */
        color: #ffffff;
        padding: 5px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        letter-spacing: 1px;
    }
    
    .pres-turn { 
        font-size: 1.3rem; font-weight: 400; color: #ffffff; 
        margin-top: 10px; text-transform: lowercase; letter-spacing: 1px;
    }
    
/* NOME DA REGIÃO (Canto Superior Esquerdo) */
    .pres-region-title {
        position: absolute; 
        top: 40px; 
        left: 50px; 
        transform: none; /* Remove a centralização automática */
        text-align: left;
        font-size: 2rem; 
        font-weight: 900; 
        letter-spacing: 2px;
        text-transform: uppercase; 
        color: rgba(255,255,255,0.85); 
        z-index: 20;
        text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        max-width: 350px; /* Limita a largura para nomes longos como "Rio Grande do Norte" */
        line-height: 1.1;
    }

/* CONTEÚDO CENTRAL (Fotos e Mapa) */
    .pres-content { 
        flex: 1; display: flex; justify-content: center; align-items: flex-start; 
        position: relative; z-index: 10; 
        padding: 20px 4vw 0 4vw; /* Reduzimos o topo de 70px para 20px, subindo os quadros */
        gap: 20px;
    }
    
/* MAPA COM "BOUNDING BOX" (Limite restrito de dimensão) */
    .pres-map-container { 
        flex: 0 0 32%; 
        height: 52vh; /* Margem reduzida e segura para nunca encostar no rodapé */
        max-width: 33vw; 
        display: flex; 
        justify-content: center; 
        align-items: center; /* Mantém o mapa flutuando no meio da sua caixa blindada */
        position: relative;
    }
    
    .pres-map-container svg { 
        width: 100%; 
        height: 100%; /* Força o mapa a nunca ultrapassar o limite da container pai */
        max-width: 100%; 
        max-height: 100%; 
        filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.7)); 
    }
    
/* COLUNAS LATERAIS DOS FINALISTAS */
    .pres-candidate-main { 
        flex: 0 0 32%; display: flex; flex-direction: column; 
        align-items: center; text-align: center;
    }
    
    .pres-photo-wrapper { 
        position: relative; width: 340px; height: 440px; margin-bottom: 20px; /* TAMANHOS AUMENTADOS */
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        background: #333;
        border-width: 4px; border-style: solid; 
    }
    .pres-photo { width: 100%; height: 100%; object-fit: cover; }
    
    .pres-party-logo-wrapper {
        position: absolute; bottom: -15px; right: -15px;
        z-index: 15;
    }
    
    .pres-party-logo {
        max-width: 90px; max-height: 50px;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
    }
    
    .pres-cand-number {
        font-size: 1.8rem; font-weight: 900; color: white;
        width: 55px; height: 55px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        border: 3px solid #fff;
    }

    .pres-cand-name { 
        font-size: 2rem; font-weight: 900; text-transform: uppercase; 
        display: flex; align-items: center; justify-content: center; gap: 12px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8); letter-spacing: -0.5px;
        margin-bottom: 4px;
    }
    
    .pres-cand-dot {
        width: 14px; height: 14px; border-radius: 50%; display: inline-block;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .pres-cand-vice { 
        font-size: 1rem; color: #cbd5e1; font-weight: 500; margin-bottom: 12px; 
    }
    
    .pres-cand-pct { 
        font-size: 5rem; font-weight: 900; line-height: 1; 
        text-shadow: 0 4px 15px rgba(0,0,0,0.6); margin-bottom: 5px; letter-spacing: -2px;
    }
    
    .pres-cand-votes { font-size: 1.1rem; color: #e2e8f0; font-weight: 400; }

    /* OUTROS CANDIDATOS (RODAPÉ) */
    .pres-bottom { 
        position: absolute; bottom: 35px; left: 0; width: 100%; 
        display: flex; justify-content: center; gap: 60px; z-index: 10; 
    }
    .pres-bottom-cand { display: flex; flex-direction: column; align-items: center; text-align: center; }
    
    .pres-bottom-photo-wrapper { position: relative; margin-bottom: 12px; }
    .pres-bottom-photo { 
        width: 85px; height: 85px; border-radius: 50%; object-fit: cover; 
        border-width: 3px; border-style: solid;
        box-shadow: 0 8px 15px rgba(0,0,0,0.6);
    }
    
    .pres-bottom-party-number {
        position: absolute; bottom: -5px; right: -5px;
        width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.8rem; font-weight: 800; color: #fff;
        box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }

    .pres-bottom-name { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    .pres-bottom-pct { font-size: 1.6rem; font-weight: 900; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

    /* CONTROLES E LOADER DA APRESENTAÇÃO */
    .pres-controls { position: absolute; top: 30px; right: 40px; display: flex; gap: 15px; z-index: 50000;}
    .pres-btn { 
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
        color: #fff; width: 45px; height: 45px; border-radius: 50%; 
        display: flex; align-items: center; justify-content: center; cursor: pointer; 
        transition: all 0.2s; font-size: 1.2rem; backdrop-filter: blur(5px); 
    }
    .pres-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }
    
    .pres-nav-area { 
        position: absolute; top: 0; height: 100%; width: 10vw; z-index: 20; cursor: pointer; 
        display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; 
    }
    .pres-nav-area:hover { opacity: 1; background: rgba(0,0,0,0.15); }
    .pres-nav-area i { font-size: 4rem; text-shadow: 0 0 20px rgba(0,0,0,0.8); color: rgba(255,255,255,0.6); }
    .pres-nav-area:hover i { color: white; transform: scale(1.1); }
    .pres-nav-left { left: 0; background: linear-gradient(90deg, rgba(0,0,0,0.3) 0%, transparent 100%); }
    .pres-nav-right { right: 0; background: linear-gradient(-90deg, rgba(0,0,0,0.3) 0%, transparent 100%);}
    
    .pres-loading { 
        position: absolute; inset: 0; background: rgba(13, 16, 46, 0.95); 
        display: flex; align-items: center; justify-content: center; z-index: 1000; 
        font-size: 2rem; flex-direction: column; gap: 20px; font-weight: 800; color: #fff;
    }
</style>
</head>
<body>
<div id="loader">
<div class="spinner"></div>
<h3 id="loaderMsg">Carregando Dados...</h3>
</div>

<!-- VIEW DE APRESENTAÇÃO E TELA CHEIA (IDÊNTICO À IMAGEM) -->
<div id="presentationOverlay">
    <div class="pres-controls">
        <button class="pres-btn" onclick="presentation.downloadSlide()" title="Baixar Slide PNG"><i class="fas fa-camera"></i></button>
        <button class="pres-btn" onclick="presentation.close()" title="Sair da Apresentação"><i class="fas fa-times"></i></button>
    </div>
    
    <div class="pres-nav-area pres-nav-left" onclick="presentation.prev()"><i class="fas fa-chevron-left"></i></div>
    <div class="pres-nav-area pres-nav-right" onclick="presentation.next()"><i class="fas fa-chevron-right"></i></div>
    
    <div class="pres-header">
        <!-- Espaços vazios deixados no código para colocar caminhos de imagens locais futuramente -->
        <div class="pres-header-side">
            <!-- <img src="caminho/para/brasao_republica.png" alt="Brasão"> -->
        </div>
        <div class="pres-header-center">
            <div class="pres-year">2026</div>
            <div class="pres-turn" id="presTurn">em primeiro turno:</div>
        </div>
        <div class="pres-header-side">
            <!-- <img src="caminho/para/bandeira_brasil.png" alt="Bandeira"> -->
        </div>
    </div>
    
    <div class="pres-region-title" id="presRegion">BRASIL</div>
    
    <div class="pres-content">
        <div class="pres-candidate-main" id="presCand1"></div>
        <div class="pres-map-container" id="presMap"></div>
        <div class="pres-candidate-main" id="presCand2"></div>
    </div>
    
    <div class="pres-bottom" id="presBottom"></div>
    
    <div id="presLoader" class="pres-loading hidden">
        <div class="spinner"></div>
        <h3>Renderizando Cenário...</h3>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modalTitle">Configuração</span>
            <span class="close-btn" onclick="app.closeModal()"><i class="fas fa-times"></i></span>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn-primary" style="width: auto; padding: 8px 24px;" onclick="app.closeModal()">Confirmar</button>
        </div>
    </div>
</div>

<div id="app">
    <!-- ESQUERDA (CONFIGURAÇÃO) -->
    <aside class="sidebar" id="sidebarConfig">
        <div class="header">
            <div class="header-top">
                <h1>Simulação 2026</h1>
            </div>
            <div class="io-buttons" style="flex-wrap: wrap; gap: 5px;">
                <button class="btn-io" onclick="app.resetToClean()"><i class="fas fa-undo"></i> Resetar</button>
                <button class="btn-io" onclick="app.exportConfig()"><i class="fas fa-download"></i> Salvar</button>
                <button class="btn-io" onclick="document.getElementById('fileInput').click()"><i class="fas fa-upload"></i> Abrir</button>
                <button class="btn-io" style="background: var(--accent-blue);" onclick="presentation.open()"><i class="fas fa-tv"></i> Apresentar</button>
                <input type="file" id="fileInput" style="display:none" onchange="app.importConfig(this)" accept=".json">
            </div>
            <div class="mode-tabs">
                <div class="mode-tab active" id="tab1" onclick="app.setTurn(1)">1º TURNO</div>
                <div class="mode-tab" id="tab2" onclick="app.setTurn(2)">2º TURNO</div>
            </div>
        </div>

        <div style="padding: 15px 15px 0 15px;">
            <div class="control-group">
                <label>VISUALIZAÇÃO</label>
                <select id="viewModeSelect" onchange="app.handleViewChange()">
                    <option value="states">Por Estados (Brasil)</option>
                    <option value="all_cities">Brasil Municipal</option>
                </select>
            </div>
        </div>
        
        <div class="controls" id="controlsT1">
            <div style="text-align:center;">
                <label>INTENÇÃO DE VOTOS (NACIONAL)</label>
                <div id="totalSimVal" style="font-size:1.3rem; font-weight:800; color:#4ade80; margin-bottom:10px;">100%</div>
            </div>
            <div id="slidersT1"></div>
            <button class="btn-secondary" onclick="app.openMatrixModal()"><span><i class="fas fa-network-wired"></i> Herança (2022)</span><i class="fas fa-chevron-right"></i></button>
            <button class="btn-secondary" onclick="app.openStateModal(1)"><span><i class="fas fa-map-marker-alt"></i> Multiplicadores Estaduais</span><i class="fas fa-chevron-right"></i></button>
            <button class="btn-primary" onclick="app.runSimulation()">CALCULAR 1º TURNO</button>
        </div>

        <div class="controls" id="controlsT2" style="display:none;">

const DEFAULT_SCENARIO = { "t1_polls": { "LULA": 47, "FLAVIO": 45, "TARCISIO": 10, "RENAN": 2, "CAIADO": 3, "ZEMA": 2, "RATINHO": 5, "CIRO": 4, "ALDO": 1, "CURY": 2 }, "t1_matrix": { "LULA": { "LULA": 1, "FLAVIO": 0, "TARCISIO": 0, "RENAN": 0, "CAIADO": 0, "ZEMA": 0, "RATINHO": 0, "CIRO": 0, "ALDO": 0 }, "JAIR": { "LULA": 0, "FLAVIO": 1, "TARCISIO": 1, "RENAN": 0, "CAIADO": 0, "ZEMA": 0, "RATINHO": 0, "CIRO": 0, "ALDO": 0 }, "CIRO": { "LULA": 0.1, "FLAVIO": 0, "TARCISIO": 0, "RENAN": 0, "CAIADO": 0, "ZEMA": 0, "RATINHO": 0, "CIRO": 1, "ALDO": 0, "CURY": 0.01 }, "SIMONE": { "LULA": 0.5, "FLAVIO": 0.5, "TARCISIO": 0, "RENAN": 0.06, "CAIADO": 0.06, "ZEMA": 0.06, "RATINHO": 0.06, "CIRO": 0, "ALDO": 0.25, "CURY": 0.5 } }, "t1_matrix_state": {}, "t1_mults": {}, "t2_migr": { "LULA": 0, "FLAVIO": 1, "TARCISIO": 1, "RENAN": 0.63, "CAIADO": 0.94, "ZEMA": 0.91, "RATINHO": 1, "CIRO": 0.37, "ALDO": 0.48, "CURY": 0.56 }, "t2_mults": {}, "active_candidates": { "LULA": true, "FLAVIO": true, "TARCISIO": false, "RENAN": true, "CAIADO": true, "ZEMA": false, "RATINHO": false, "CIRO": false, "ALDO": true }};

const CLEAN_SCENARIO = { t1_polls: { "LULA": 30, "FLAVIO": 30, "TARCISIO": 10, "RENAN": 5, "CAIADO": 5, "ZEMA": 5, "RATINHO": 5, "CIRO": 5, "ALDO": 5 }, t1_matrix: { "LULA": { "LULA": 1, "FLAVIO": 0, "TARCISIO": 0, "RENAN": 0, "CAIADO": 0, "ZEMA": 0, "RATINHO": 0, "CIRO": 0, "ALDO": 0 }, "JAIR": { "LULA": 0, "FLAVIO": 1, "TARCISIO": 0, "RENAN": 0, "CAIADO": 0, "ZEMA": 0, "RATINHO": 0, "CIRO": 0, "ALDO": 0 }, "CIRO": { "LULA": 0, "FLAVIO": 0, "TARCISIO": 0, "RENAN": 0, "CAIADO": 0, "ZEMA": 0, "RATINHO": 0, "CIRO": 1, "ALDO": 0 }, "SIMONE": { "LULA": 0.5, "FLAVIO": 0.5, "TARCISIO": 0, "RENAN": 0, "CAIADO": 0, "ZEMA": 0, "RATINHO": 0, "CIRO": 0, "ALDO": 0 } }, t1_matrix_state: {}, t1_mults: {}, t2_migr: { "LULA":0, "FLAVIO":1, "TARCISIO":1, "RENAN":0.5, "CAIADO":1, "ZEMA":1, "RATINHO":1, "CIRO":0.5, "ALDO":0.5 }, t2_mults: {}, active_candidates: { "LULA": true, "FLAVIO": true, "TARCISIO": true, "RENAN": true, "CAIADO": true, "ZEMA": true, "RATINHO": true, "CIRO": true, "ALDO": true } };

// -- APRESENTAÇÃO E SLIDES METROPOLITANOS --
const presentation = {
    slides:[], currentIndex: 0, isActive: false,
    
    open: async () => {
        if(!app.data.base22) return;
        const loader = document.getElementById('loader');
        loader.classList.remove('hidden');
        document.getElementById('loaderMsg').innerText = "Carregando Dados Cartográficos...";

        if(!app.data.geoJson) {
            try { const r = await fetch("https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json"); app.data.geoJson = await r.json(); } catch(e) {}
        }
        
        presentation.slides =[{ id: 'BR', name: 'BRASIL', type: 'nacional' }];
        
        // Adiciona todos os Estados
        STATES.forEach(s => presentation.slides.push({ id: s.id, name: s.nome, type: 'estado' }));
        
        // ADIÇÃO CRÍTICA: Geração dinâmica das Regiões Metropolitanas (RM) baseada nos IDs lidos do geojson de Zonas Eleitorais
        if (app.data.zoneToRM) {
            const rmes =[...new Set(Object.values(app.data.zoneToRM))];
            rmes.forEach(rmName => {
                if(rmName) presentation.slides.push({ id: rmName, name: `RM - ${rmName}`, type: 'rm' });
            });
        }
        
        presentation.currentIndex = 0; presentation.isActive = true;
        document.getElementById('presentationOverlay').classList.add('active');
        document.addEventListener('keydown', presentation.handleKeydown);
        loader.classList.add('hidden'); presentation.renderSlide();
    },
    
    close: () => { 
        presentation.isActive = false; 
        document.getElementById('presentationOverlay').classList.remove('active'); 
        document.removeEventListener('keydown', presentation.handleKeydown); 
    },
    
    prev: () => { presentation.currentIndex = presentation.currentIndex > 0 ? presentation.currentIndex - 1 : presentation.slides.length - 1; presentation.renderSlide(); },
    next: () => { presentation.currentIndex = presentation.currentIndex < presentation.slides.length - 1 ? presentation.currentIndex + 1 : 0; presentation.renderSlide(); },
    handleKeydown: (e) => { if(e.key === 'ArrowRight') presentation.next(); if(e.key === 'ArrowLeft') presentation.prev(); if(e.key === 'Escape') presentation.close(); },

    downloadSlide: async () => {
        document.body.style.cursor = 'wait';
        try {
            const originalOverlay = document.getElementById('presentationOverlay');
            const exportContainer = document.createElement('div');
            exportContainer.style.position = 'absolute'; exportContainer.style.top = '0'; exportContainer.style.left = '0';
            exportContainer.style.width = originalOverlay.offsetWidth + 'px'; exportContainer.style.height = originalOverlay.offsetHeight + 'px';
            exportContainer.style.background = '#0d102e'; exportContainer.style.zIndex = '-9999'; exportContainer.style.overflow = 'hidden';
            
            const clone = originalOverlay.cloneNode(true);
            clone.id = "presentationOverlayClone"; clone.style.position = 'relative'; clone.style.width = '100%'; clone.style.height = '100%'; clone.style.background = 'transparent';
            
            const controls = clone.querySelector('.pres-controls'); if(controls) controls.remove();
            clone.querySelectorAll('.pres-nav-area').forEach(n => n.remove());
            clone.querySelectorAll('svg').forEach(svg => { svg.style.filter = 'none'; });

            exportContainer.appendChild(clone); document.body.appendChild(exportContainer);
            const finalCanvas = await html2canvas(exportContainer, { useCORS: true, scale: 2, backgroundColor: '#0d102e', logging: false });
            
            finalCanvas.toBlob((blob) => { const regionName = document.getElementById('presRegion').innerText; saveAs(blob, `Slide_${regionName}_2026.png`); }, 'image/png', 1.0);
            document.body.removeChild(exportContainer);
        } catch (error) { alert("Erro ao exportar slide."); } finally { document.body.style.cursor = 'default'; }
    },
    
    renderSlide: () => {
        const slide = presentation.slides[presentation.currentIndex];
        document.getElementById('presRegion').innerText = slide.name;
        document.getElementById('presTurn').innerText = app.state.turn === 1 ? "em primeiro turno:" : "em segundo turno:";
        
        const dataset = app.state.turn === 1 ? app.data.round1 : app.data.round2; if(!dataset) return;

        let votes = {};
        if (slide.type === 'nacional') votes = dataset.nacional;
        else if (slide.type === 'estado') votes = dataset.estados[slide.id] || {};
        else if (slide.type === 'rm') {
            // Soma todos os votos das zonas que compõe esta Região Metropolitana específica
            for (let zId in dataset.zonas) {
                if (app.data.zoneToRM[zId] === slide.id) {
                    for (let cid in dataset.zonas[zId]) {
                        votes[cid] = (votes[cid] || 0) + dataset.zonas[zId][cid];
                    }
                }
            }
        }

        const sorted = Object.entries(votes).sort((a,b) => b[1] - a[1]);
        const total = sorted.reduce((a,b) => a+b[1], 0);

        const validSorted = sorted.filter(([cid, v]) => { const cand = CONFIG.candidates.find(c=>c.id===cid); return cand && !(app.state.turn===1 && app.state.active_candidates[cid] === false && v === 0); });

        presentation.renderMainCand('presCand1', validSorted[0], total);
        presentation.renderMainCand('presCand2', validSorted[1], total);
        
        const bottomContainer = document.getElementById('presBottom'); bottomContainer.innerHTML = '';
        for(let i=2; i < Math.min(validSorted.length, 6); i++) presentation.renderBottomCand(bottomContainer, validSorted[i], total);
        
        presentation.drawMap(slide);
    },
    
    renderMainCand: (elementId, data, total) => {
        const el = document.getElementById(elementId); if(!data) { el.innerHTML = ''; return; }
        const cand = CONFIG.candidates.find(c=>c.id===data[0]); const pct = total > 0 ? (data[1]/total)*100 : 0;
        const photoUrl = CANDIDATE_PHOTOS[cand.id] || `https://via.placeholder.com/300x400/${cand.color.substring(1)}/ffffff.png?text=${cand.name}`;
        
        // Construção idêntica à foto
        el.innerHTML = `
            <div class="pres-photo-wrapper" style="border-color: ${cand.color}">
                <img src="${photoUrl}" class="pres-photo" onerror="this.src='https://via.placeholder.com/300x400/333/fff?text=${cand.name}'">
                <div class="pres-party-logo-wrapper">
                    <img src="${cand.logo}" class="pres-party-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="pres-cand-number" style="display: ${cand.logo ? 'none' : 'flex'}; background-color: ${cand.color}">${cand.number}</div>
                </div>
            </div>
            <div class="pres-cand-name">
                <span class="pres-cand-dot" style="background-color: ${cand.color}"></span>
                ${cand.name}
            </div>
            <div class="pres-cand-vice">Vice: ${cand.vice || 'Não definido'}</div>
            <div class="pres-cand-pct">${pct.toFixed(2).replace('.', ',')}%</div>
            <div class="pres-cand-votes">${data[1].toLocaleString('pt-BR')} dos votos</div>
        `;
    },
    
    renderBottomCand: (container, data, total) => {
        if(!data) return; const cand = CONFIG.candidates.find(c=>c.id===data[0]); const pct = total > 0 ? (data[1]/total)*100 : 0;
        const photoUrl = CANDIDATE_PHOTOS[cand.id] || `https://via.placeholder.com/100x100/${cand.color.substring(1)}/ffffff.png?text=${cand.id.substring(0,3)}`;
        
        const div = document.createElement('div'); div.className = 'pres-bottom-cand';
        div.innerHTML = `
            <div class="pres-bottom-photo-wrapper">
                <img src="${photoUrl}" class="pres-bottom-photo" style="border-color: ${cand.color}" onerror="this.src='https://via.placeholder.com/100/333/fff'">
                <div class="pres-bottom-party-number" style="background-color: ${cand.color}">${cand.number}</div>
            </div>
            <div class="pres-bottom-name">${cand.name.split(' ')[0]}</div>
            <div class="pres-bottom-pct">${pct.toFixed(2).replace('.', ',')}%</div>
        `;
        container.appendChild(div);
    },
    
    drawMap: (slide) => {
        const container = document.getElementById('presMap'); let features =[]; let scope = '';
        if(slide.type === 'nacional') { 
            if(!app.data.brazilGeoJson) return; features = app.data.brazilGeoJson.features; scope = 'estados'; 
        } else if (slide.type === 'estado') { 
            if(!app.data.geoJson) return; features = app.data.geoJson.features.filter(f => app.getFeatureId(f, 'municipios').startsWith(slide.id)); scope = 'municipios'; 
        } else if (slide.type === 'rm') {
            if(!app.data.zonasGeoJson) return; features = app.data.zonasGeoJson.features.filter(f => f.properties.RME_NOME === slide.id); scope = 'zonas';
        }
        
        if(features.length === 0) { container.innerHTML = ''; return; }
        
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        features.forEach(f => { const scan = (coords) => { coords.forEach(pt => { if(typeof pt[0]==='number') { if(pt[0]<minX) minX=pt[0]; if(pt[0]>maxX) maxX=pt[0]; if(pt[1]<minY) minY=pt[1]; if(pt[1]>maxY) maxY=pt[1]; } else scan(pt); }); }; if(f.geometry && f.geometry.coordinates) scan(f.geometry.coordinates); });
        
        const w = 800; const latD = maxY - minY; const lonD = maxX - minX; const h = w / (lonD/latD); const proj = (x,y) =>[(x-minX)*(w/lonD), (maxY-y)*(h/latD)];
        let svg = '';
        
        features.forEach(f => { 
            const id = app.getFeatureId(f, scope); 
            const col = app.getColorForId(id, scope).fill; 
            let d = ''; 
            const draw = (r) => { let p=''; r.forEach((pt,i)=>{ const[px,py]=proj(pt[0],pt[1]); p+=(i===0?'M':'L')+px.toFixed(1)+','+py.toFixed(1); }); return p+'Z '; }; 
            if(f.geometry.type==='Polygon') f.geometry.coordinates.forEach(r=>d+=draw(r)); 
            else if(f.geometry.type==='MultiPolygon') f.geometry.coordinates.forEach(p=>p.forEach(r=>d+=draw(r))); 
            svg += `<path d="${d}" fill="${col}" stroke="#04285e" stroke-width="0.6"/>`; 
        });
        
        container.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">${svg}</svg>`;
    }
};

const app = {
    map: null,
    layers: { brazil: null, cities: null, zones: null },
    data: { base22: null, round1: null, round2: null, geoJson: null, names: {}, brazilGeoJson: null, zonasGeoJson: null, zoneToRM: {} },
    state: { turn: 1, view: 'states', selectedId: null, selectedName: "Brasil", selectedScope: null, activeCityId: null, t1_polls: {}, t1_matrix: {}, t1_matrix_state: {}, t1_mults: {}, t2_finalists:[], t2_polls: {}, t2_migr: {}, t2_mults: {}, active_candidates: {}, t2_mode: 'manual' },

    init: async () => {
        app.map = L.map('map', { center: [-15, -50], zoom: 4, zoomControl: false, preferCanvas: true, background: '#1a1a1a', renderer: L.canvas({ tolerance: 0, padding: 0.5 }) });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { opacity: 0.4 }).addTo(app.map);
        if(typeof DEFAULT_SCENARIO !== 'undefined') app.loadScenario(DEFAULT_SCENARIO);
        else { CONFIG.candidates.forEach(c => { app.state.t1_polls[c.id] = c.val; app.state.active_candidates[c.id] = c.active; });['LULA','JAIR','CIRO','SIMONE'].forEach(src => { app.state.t1_matrix[src] = {}; CONFIG.candidates.forEach(dest => app.state.t1_matrix[src][dest.id] = 0); }); }
        app.renderLegend(); app.renderUI(); await app.loadData();
    },

    mobileNav: (tab) => {
        const left = document.getElementById('sidebarConfig'), right = document.getElementById('sidebarResults'), items = document.querySelectorAll('.nav-item');
        items.forEach(i => i.classList.remove('active')); document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');

    processZonasGeoJson: () => {
        app.data.base22.zonas = {};
        app.data.zoneToRM = {}; // Mapeamento dinâmico para Regiões Metropolitanas
        
        app.data.zonasGeoJson.features.forEach(f => {
            const p = f.properties; 
            const id = String(p.CD_MUN_I) + '_' + String(p.ZE_NUM);
            app.data.base22.zonas[id] = { LULA: p.PS22_113 || 0, JAIR: p.PS22_122 || 0, CIRO: p.PS22_112 || 0, SIMONE: p.PS22_115 || 0 };
            
            // Se o arquivo contiver o identificador de região metropolitana pedido (RME_NOME)

                app.data.zoneToRM[id] = p.RME_NOME;
            }

    },

    loadAllMunicipalities: async () => { const loader = document.getElementById('loader'); loader.classList.remove('hidden'); if(app.layers.brazil && app.map.hasLayer(app.layers.brazil)) app.map.removeLayer(app.layers.brazil); if(app.layers.zones) { app.map.removeLayer(app.layers.zones); app.layers.zones = null; } if(app.layers.cities) app.map.removeLayer(app.layers.cities); app.layers.cities = null; if(!app.data.geoJson) { const r = await fetch("https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json"); app.data.geoJson = await r.json(); } app.layers.cities = L.geoJSON(app.data.geoJson, { style: (f) => app.getStyle(f, 'municipios'), onEachFeature: (f, l) => { l.on('click', (e) => { L.DomEvent.stopPropagation(e); const cityId = app.getFeatureId(f, 'municipios'); const cityName = f.properties.NM_MUN||f.properties.name; if (app.data.zonasGeoJson && app.data.zonasGeoJson.features.some(zf => String(zf.properties.CD_MUN_I) === cityId)) { app.loadCityZones(cityId, cityName); return; } app.selectRegion(cityId, cityName, 'municipios'); }); app.bindTooltip(l, 'municipios'); } }).addTo(app.map); if (app.layers.cities.getBounds().isValid()) app.map.fitBounds(app.layers.cities.getBounds()); loader.classList.add('hidden'); },
    
    loadStateCities: async (ufId, ufName) => { if(app.state.view === 'all_cities') return; const loader = document.getElementById('loader'); loader.classList.remove('hidden'); document.getElementById('loaderMsg').innerText = `Carregando ${ufName}...`; if(app.layers.zones) { app.map.removeLayer(app.layers.zones); app.layers.zones = null; } if(app.layers.cities) { app.map.removeLayer(app.layers.cities); app.layers.cities = null; } if(app.layers.brazil) app.map.removeLayer(app.layers.brazil); if(!app.data.geoJson) { const r = await fetch("https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json"); app.data.geoJson = await r.json(); } const feats = app.data.geoJson.features.filter(f => app.getFeatureId(f, 'municipios').startsWith(ufId)); app.layers.cities = L.geoJSON({ type:"FeatureCollection", features:feats }, { style: (f) => app.getStyle(f, 'municipios'), onEachFeature: (f, l) => { l.on('click', (e) => { L.DomEvent.stopPropagation(e); const cityId = app.getFeatureId(f, 'municipios'); const cityName = f.properties.NM_MUN||f.properties.name; if (app.data.zonasGeoJson && app.data.zonasGeoJson.features.some(zf => String(zf.properties.CD_MUN_I) === cityId)) { app.loadCityZones(cityId, cityName); return; } app.selectRegion(cityId, cityName, 'municipios'); }); app.bindTooltip(l, 'municipios'); } }).addTo(app.map); if (app.layers.cities.getBounds().isValid()) app.map.fitBounds(app.layers.cities.getBounds()); app.selectRegion(ufId, ufName, 'estados'); loader.classList.add('hidden'); },

    getStyle: (feature, scope) => { const id = app.getFeatureId(feature, scope); return { fillColor: app.getColorForId(id, scope).fill, weight: scope === 'estados' ? 0.8 : 0.5, color: '#ffffff', opacity: 1, fillOpacity: 1 }; },
    getColorForId: (id, scope) => { if (!id) return { fill: '#333' }; const dataset = app.state.turn === 1 ? app.data.round1 : app.data.round2; if(!dataset) return { fill: '#333' }; let votes; if (scope === 'zonas') votes = dataset.zonas ? dataset.zonas[id] : null; else if (id.length === 2 && scope === 'estados') votes = dataset.estados[id]; else votes = dataset.municipios[id]; if(!votes) return { fill: '#333' }; let max = -1, winner = null, total = 0; for(let c in votes) { total += votes[c]; if(votes[c] > max) { max = votes[c]; winner = c; } } const cand = CONFIG.candidates.find(c => c.id === winner); return { fill: app.getDiscreteColor(cand ? cand.color : '#555', total > 0 ? (max/total)*100 : 0) }; },
    
    generateStaticMap: async (format) => { const loader = document.getElementById('loader'); loader.classList.remove('hidden'); setTimeout(() => { try { let features =[]; let scope = 'municipios'; if (app.layers.zones && app.state.activeCityId) { features = app.data.zonasGeoJson.features.filter(f => String(f.properties.CD_MUN_I) === app.state.activeCityId); scope = 'zonas'; } else if (app.state.view === 'states' && !app.state.selectedId) { features = app.data.brazilGeoJson.features; scope = 'estados'; } else if (app.state.selectedId && app.state.selectedId.length === 2) { features = app.data.geoJson.features.filter(f => app.getFeatureId(f, 'municipios').startsWith(app.state.selectedId)); scope = 'municipios'; } else if (app.state.view === 'all_cities') { features = app.data.geoJson.features; scope = 'municipios'; } else { features = app.data.brazilGeoJson.features; scope = 'estados'; } if (features.length === 0) throw new Error("Nenhum dado."); let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity; features.forEach(f => { const scan = (coords) => { coords.forEach(pt => { if(typeof pt[0]==='number'){ if(pt[0]<minX)minX=pt[0]; if(pt[0]>maxX)maxX=pt[0]; if(pt[1]<minY)minY=pt[1]; if(pt[1]>maxY)maxY=pt[1]; } else scan(pt); }); }; if(f.geometry && f.geometry.type.includes('Polygon')) scan(f.geometry.coordinates); }); const w = 4096, latD = maxY - minY, lonD = maxX - minX, h = w / (lonD/latD); const proj = (x,y) =>[(x-minX)*(w/lonD), (maxY-y)*(h/latD)]; let svg = ''; features.forEach(f => { const id = app.getFeatureId(f, scope); const col = app.getColorForId(id, scope).fill; let d = ''; const draw = (r) => { let p=''; r.forEach((pt,i)=>{ const[px,py]=proj(pt[0],pt[1]); p+=(i===0?'M':'L')+px.toFixed(1)+','+py.toFixed(1); }); return p+'Z '; }; if(f.geometry.type==='Polygon') f.geometry.coordinates.forEach(r=>d+=draw(r)); else if(f.geometry.type==='MultiPolygon') f.geometry.coordinates.forEach(p=>p.forEach(r=>d+=draw(r))); svg+=`<path d="${d}" fill="${col}"     getDiscreteColor: (hex, pct) => { let config = CONFIG.scheme[0]; for (let i = 0; i < CONFIG.scheme.length; i++) if (pct >= CONFIG.scheme[i].min) config = CONFIG.scheme[i]; return app.mixColor(hex, config.mix, config.ratio); },
    mixColor: (hex1, hex2, amount) => { const c1 = app.hexToRgb(hex1), c2 = app.hexToRgb(hex2); return `rgb(${Math.round(c1.r + (c2.r - c1.r) * amount)}, ${Math.round(c1.g + (c2.g - c1.g) * amount)}, ${Math.round(c1.b + (c2.b - c1.b) * amount)})`; },
    hexToRgb: (hex) => { let c = hex.substring(1).split(''); if(c.length==3) c= [c[0], c[0], c[1], c[1], c[2], c[2]]; c = '0x'+c.join(''); return { r: (c>>16)&255, g: (c>>8)&255, b: c&255 }; },
    bindTooltip: (l, s) => { l.bindTooltip(() => { const id = app.getFeatureId(l.feature, s); const dataset = app.state.turn === 1 ? app.data.round1 : app.data.round2; if(!dataset) return "Dados indisponíveis"; let votes; if (s === 'zonas') votes = dataset.zonas ? dataset.zonas[id] : null; else if (id.length===2 && s==='estados') votes = dataset.estados[id]; else votes = dataset.municipios[id]; if(!votes) return `Sem dados`; const sorted = Object.entries(votes).sort((a,b)=>b[1]-a[1]); const wObj = CONFIG.candidates.find(c=>c.id===sorted[0][0]); let title = l.feature.properties.NM_MUN || l.feature.properties.NM_UF || l.feature.properties.name; if (s === 'zonas') title = `Zona ${l.feature.properties.ZE_NUM} - ${l.feature.properties.MUN_NOME}`; return `<div class="custom-tooltip"><div class="tt-head">${title}</div><div class="tt-body"><div style="color:${wObj.color}; font-weight:800"><i class="fas ${wObj.icon}"></i> ${wObj.name}</div><div>${((sorted[0][1]/(sorted.reduce((a,b)=>a+b[1],0)||1))*100).toFixed(1)}%</div></div></div>`; }, { sticky: true }); },
    refreshMap: () => { if(app.layers.brazil) app.layers.brazil.setStyle((f) => app.getStyle(f, 'estados')); if(app.layers.cities) app.layers.cities.setStyle((f) => app.getStyle(f, 'municipios')); if(app.layers.zones) app.layers.zones.setStyle((f) => app.getStyle(f, 'zonas')); },

    renderUI: () => { const c = document.getElementById('slidersT1'); c.innerHTML = ''; CONFIG.candidates.forEach(cand => { const isActive = app.state.active_candidates[cand.id] !== false; const div = document.createElement('div'); div.className = `slider-box ${isActive ? '' : 'inactive'}`; div.innerHTML = `<div class="slider-header"><div style="display:flex; align-items:center; gap:8px"><input type="checkbox" ${isActive ? 'checked' : ''} onchange="app.toggleCandidate('${cand.id}', this.checked)"><span style="color:${cand.color}; font-weight:700"><i class="fas ${cand.icon}"></i> ${cand.name}</span></div><span id="val_t1_${cand.id}">${app.state.t1_polls[cand.id]}%</span></div><input type="range" min="0" max="100" value="${app.state.t1_polls[cand.id]}" ${isActive ? '' : 'disabled'} oninput="app.updateT1Poll('${cand.id}', this.value)">`; c.appendChild(div); }); const c1 = document.getElementById('candFinal1'), c2 = document.getElementById('candFinal2'); const activeCands = CONFIG.candidates.filter(c => app.state.active_candidates[c.id] !== false); const opts = activeCands.map(c => `<option value="${c.id}">${c.name}</option>`).join(''); c1.innerHTML = opts; c2.innerHTML = opts; if(activeCands.length >= 2) { if(!activeCands.find(c=>c.id === app.state.t2_finalists[0])) app.state.t2_finalists[0] = activeCands[0].id; if(!activeCands.find(c=>c.id === app.state.t2_finalists[1])) app.state.t2_finalists[1] = activeCands[1].id; c1.value = app.state.t2_finalists[0]; c2.value = app.state.t2_finalists[1]; } app.updateTotalT1Label(); app.updateT2UI(); },

    updateT2UI: () => { const c1 = document.getElementById('candFinal1'), c2 = document.getElementById('candFinal2'); if(!c1.value || !c2.value) return; if (c1.value === c2.value) { const active = CONFIG.candidates.filter(c => app.state.active_candidates[c.id]!==false); if(active.length > 1) c2.value = active.find(c => c.id !== c1.value).id; } app.state.t2_finalists =[c1.value, c2.value]; const slidersDiv = document.getElementById('slidersT2'); slidersDiv.innerHTML = '';[CONFIG.candidates.find(c=>c.id===c1.value), CONFIG.candidates.find(c=>c.id===c2.value)].forEach(cand => { if(!cand) return; const current = app.state.t2_polls[cand.id] !== undefined ? app.state.t2_polls[cand.id] : 50; const div = document.createElement('div'); div.className = `slider-box ${app.state.t2_mode === 'organic' ? 'inactive' : ''}`; div.innerHTML = `<div class="slider-header"><span style="color:${cand.color}; font-weight:700"><i class="fas ${cand.icon}"></i> ${cand.name}</span><span id="val_t2_${cand.id}">${current}%</span></div><input type="range" min="0" max="100" value="${current}" ${app.state.t2_mode === 'organic' ? 'disabled' : ''} oninput="app.state.t2_polls['${cand.id}'] = parseInt(this.value); document.getElementById('val_t2_${cand.id}').innerText=this.value+'%'; app.checkT2Total();">`; slidersDiv.appendChild(div); }); app.checkT2Total(); },

    updateSidebarRight: () => {
        const title = document.getElementById('regionName'), sub = document.getElementById('regionType'), list = document.getElementById('resultsContainer');
        title.innerText = app.state.selectedName; 
        let subTxt = "Nacional"; if (app.state.selectedId) { if (app.state.selectedScope === 'zonas') subTxt = "Zona Eleitoral"; else if (app.state.selectedId.length === 2) subTxt = "Estado"; else subTxt = "Município"; }
        sub.innerText = subTxt; list.innerHTML = '';
        const dataset = app.state.turn === 1 ? app.data.round1 : app.data.round2; if(!dataset) return;
        let votes = {};
        if(app.state.selectedId) { if (app.state.selectedScope === 'zonas') votes = dataset.zonas ? dataset.zonas[app.state.selectedId] : {}; else if(app.state.selectedId.length === 2) votes = dataset.estados[app.state.selectedId]; else votes = dataset.municipios[app.state.selectedId]; } else votes = dataset.nacional;
        if(!votes) return;
        const sorted = Object.entries(votes).sort((a,b)=>b[1]-a[1]); const total = sorted.reduce((a,b)=>a+b[1],0); 
        if(document.getElementById('totalVotesVal')) document.getElementById('totalVotesVal').innerText = total.toLocaleString();

        sorted.forEach(([cid, v]) => {
            const cand = CONFIG.candidates.find(c=>c.id===cid); if(!cand) return;
            if(app.state.turn===1 && app.state.active_candidates[cand.id] === false && v === 0) return;
            const pct = total > 0 ? (v/total)*100 : 0;
            const row = document.createElement('div'); row.className = 'cand-row';
            row.innerHTML = `<div class="cand-color" style="background:${cand.color}"></div><div class="cand-info"><div class="cand-head"><span><i class="fas ${cand.icon}"></i> ${cand.name}</span><span style="color:${cand.color}">${pct.toFixed(2)}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%; background:${cand.color}"></div></div><div style="text-align:right; font-size:0.7rem; color:#666; margin-top:3px;">${v.toLocaleString()} votos</div></div>`;
            list.appendChild(row);
        });
    },

    openModal: (title, html) => { document.getElementById('modalTitle').innerText = title; document.getElementById('modalBody').innerHTML = html; document.getElementById('modalOverlay').classList.add('active'); },
    closeModal: () => { document.getElementById('modalOverlay').classList.remove('active'); },
    
    openMatrixModal: () => { const sources =['LULA','JAIR','CIRO','SIMONE']; let html = `<div style="display:flex; gap:10px; margin-bottom:15px;"><div style="flex:1"><label style="color:#aaa; font-size:0.8rem">FONTE (2022):</label><select id="modalSrcSelect" onchange="app.renderModalMatrix()" style="width:100%">${sources.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div><div style="flex:1"><label style="color:#aaa; font-size:0.8rem">ESTADO:</label><select id="modalUfSelect" onchange="app.renderModalMatrix()" style="width:100%"><option value="">Nacional (Padrão)</option>${STATES.map(s => `<option value="${s.id}">${s.sigla}</option>`).join('')}</select></div></div><div id="modalMatrixContent"></div><div style="font-size:0.7rem; color:#666; margin-top:10px;">* Se um Estado for selecionado, os valores substituem a regra nacional para aquele estado.</div>`; app.openModal("Matriz de Herança", html); app.renderModalMatrix(); },
    renderModalMatrix: () => { const src = document.getElementById('modalSrcSelect') ? document.getElementById('modalSrcSelect').value : 'LULA'; const ufId = document.getElementById('modalUfSelect') ? document.getElementById('modalUfSelect').value : ''; const c = document.getElementById('modalMatrixContent'); c.innerHTML = ''; CONFIG.candidates.forEach(dest => { let val = ufId ? (app.state.t1_matrix_state[ufId] && app.state.t1_matrix_state[ufId][src] ? app.state.t1_matrix_state[ufId][src][dest.id] : app.state.t1_matrix[src][dest.id]) : app.state.t1_matrix[src][dest.id]; val = (val||0) * 100; const div = document.createElement('div'); div.className = 'slider-box'; div.innerHTML = `<div class="slider-header"><span style="color:${dest.color}; font-weight:bold"><i class="fas ${dest.icon}"></i> ${dest.name}</span><span id="mod_mtx_${dest.id}">${Math.round(val)}%</span></div><input type="range" min="0" max="100" value="${val}" oninput="app.updateMatrixValue('${src}', '${ufId}', '${dest.id}', this.value); document.getElementById('mod_mtx_${dest.id}').innerText=this.value+'%';">`; c.appendChild(div); }); },
    updateMatrixValue: (src, ufId, destId, val) => { const ratio = parseInt(val)/100; if(ufId) { if(!app.state.t1_matrix_state[ufId]) app.state.t1_matrix_state[ufId] = {}; if(!app.state.t1_matrix_state[ufId][src]) app.state.t1_matrix_state[ufId][src] = {...app.state.t1_matrix[src]}; app.state.t1_matrix_state[ufId][src][destId] = ratio; } else app.state.t1_matrix[src][destId] = ratio; },
    openStateModal: (turn) => { let html = `<div style="margin-bottom:15px"><label style="color:#aaa; font-size:0.8rem">ESTADO:</label><select id="modalStateSelect" onchange="app.renderModalStateMults(${turn}, this.value)" style="width:100%"><option value="">Selecione...</option>${STATES.map(s => `<option value="${s.id}">${s.nome} (${s.sigla})</option>`).join('')}</select></div><div id="modalStateContent"></div>`; app.openModal(turn === 1 ? "Multiplicadores (1º Turno)" : "Multiplicadores (2º Turno)", html); },
    renderModalStateMults: (turn, ufId) => { const c = document.getElementById('modalStateContent'); c.innerHTML = ''; if(!ufId) return; const store = turn===1 ? app.state.t1_mults : app.state.t2_mults; if(!store[ufId]) store[ufId] = {}; (turn===1 ? CONFIG.candidates : app.state.t2_finalists.map(id => CONFIG.candidates.find(c=>c.id===id))).forEach(cand => { if(!cand || (turn===1 && app.state.active_candidates[cand.id] === false)) return; const val = store[ufId][cand.id] !== undefined ? store[ufId][cand.id] : 1.0; const div = document.createElement('div'); div.className = 'slider-box'; div.innerHTML = `<div class="slider-header"><span style="color:${cand.color}; font-weight:bold"><i class="fas ${cand.icon}"></i> ${cand.name}</span><span id="mod_mul_${cand.id}">x${val.toFixed(2)}</span></div><input type="range" min="0" max="300" value="${val*100}" oninput="app.updateMult(${turn}, '${ufId}', '${cand.id}', this.value); document.getElementById('mod_mul_${cand.id}').innerText='x'+(this.value/100).toFixed(2);">`; c.appendChild(div); }); },
    updateMult: (turn, ufId, cid, val) => { const store = turn===1 ? app.state.t1_mults : app.state.t2_mults; if(!store[ufId]) store[ufId] = {}; store[ufId][cid] = parseInt(val)/100; },
    openMigrationModal: () => { const[id1, id2] = app.state.t2_finalists; let html = `<div style="text-align:center; font-size:0.8rem; color:#888; margin-bottom:15px">Configure para quem os eleitores migrarão.<br>Esquerda (0%): <b>${CONFIG.candidates.find(c=>c.id===id1).name}</b> | Direita (100%): <b>${CONFIG.candidates.find(c=>c.id===id2).name}</b></div><div id="modalMigContent"></div>`; app.openModal("Transferência de Votos", html); const c = document.getElementById('modalMigContent'); CONFIG.candidates.forEach(cand => { if(cand.id === id1 || cand.id === id2 || app.state.active_candidates[cand.id] === false) return; const ratio = app.state.t2_migr[cand.id] !== undefined ? app.state.t2_migr[cand.id] : 0.5; const div = document.createElement('div'); div.className = 'slider-box'; div.innerHTML = `<div class="slider-header"><span style="color:${cand.color}; font-weight:bold">Votos de ${cand.name}</span></div><div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#aaa; margin-bottom:5px;"><span style="color:${CONFIG.candidates.find(x=>x.id===id1).color}">${CONFIG.candidates.find(x=>x.id===id1).name}</span><span style="color:${CONFIG.candidates.find(x=>x.id===id2).color}">${CONFIG.candidates.find(x=>x.id===id2).name}</span></div><input type="range" min="0" max="100" value="${ratio*100}" oninput="app.state.t2_migr['${cand.id}'] = this.value/100;">`; c.appendChild(div); }); },

    getMatrixValue: (ufId, src, destId) => { return (app.state.t1_matrix_state[ufId] && app.state.t1_matrix_state[ufId][src] && app.state.t1_matrix_state[ufId][src][destId] !== undefined) ? app.state.t1_matrix_state[ufId][src][destId] : (app.state.t1_matrix[src][destId] || 0); },

    runSimulation: () => { if(!app.data.base22) return; const loader = document.getElementById('loader'); loader.classList.remove('hidden'); document.getElementById('loaderMsg').innerText = "Calculando..."; setTimeout(() => { if(app.state.turn === 1) app.calculateTurn1(); else { if(!app.data.round1) app.calculateTurn1(); app.calculateTurn2(); } app.refreshMap(); app.updateSidebarRight(); loader.classList.add('hidden'); }, 50); },

    calculateTurn1: () => {
        const base = app.data.base22.municipios;
        const activeIds = CONFIG.candidates.filter(c => app.state.active_candidates[c.id] !== false).map(c => c.id);
        const rawSliderTotal = activeIds.reduce((sum, id) => sum + (app.state.t1_polls[id]||0), 0);
        const targetPcts = {}; activeIds.forEach(id => { targetPcts[id] = (app.state.t1_polls[id]||0) / (rawSliderTotal || 1); });
        const res = { municipios: {}, estados: {}, nacional: {}, zonas: {} }; let tempNacional = {}, grandTotal = 0;
        
        for(let ibge in base) {
            const votes22 = base[ibge], ufId = ibge.substring(0,2), mVotes = {};
            activeIds.forEach(candId => {
                let sum = 0;['LULA','JAIR','CIRO','SIMONE'].forEach(srcKey => {
                    const rawVal = app.getMatrixValue(ufId, srcKey, candId);
                    let totalActiveWeight = 0; activeIds.forEach(cid => { totalActiveWeight += app.getMatrixValue(ufId, srcKey, cid); });
                    let finalFactor = 0; if(totalActiveWeight > 0) finalFactor = rawVal / totalActiveWeight;
                    sum += app.getVotes22(votes22, srcKey) * finalFactor;
                });
                if(app.state.t1_mults[ufId] && app.state.t1_mults[ufId][candId]) sum *= app.state.t1_mults[ufId][candId];
                mVotes[candId] = sum; tempNacional[candId] = (tempNacional[candId]||0) + sum; grandTotal += sum;
            });
            res.municipios[ibge] = mVotes;
        }
        const corrections = {}; activeIds.forEach(id => { const currPct = tempNacional[id] / (grandTotal||1); corrections[id] = (currPct > 0) ? targetPcts[id]/currPct : 1; });
        for(let ibge in res.municipios) {
            const ufId = ibge.substring(0,2); if(!res.estados[ufId]) res.estados[ufId] = {};
            for(let cid in res.municipios[ibge]) { let v = Math.round(res.municipios[ibge][cid] * corrections[cid]); res.municipios[ibge][cid] = v; res.estados[ufId][cid] = (res.estados[ufId][cid]||0) + v; res.nacional[cid] = (res.nacional[cid]||0) + v; }
        }
        
        if (app.data.base22.zonas) {
            for(let zId in app.data.base22.zonas) {
                const votes22 = app.data.base22.zonas[zId], ufId = String(zId).substring(0,2), zVotes = {};
                activeIds.forEach(candId => {
                    let sum = 0;['LULA','JAIR','CIRO','SIMONE'].forEach(srcKey => {
                        const rawVal = app.getMatrixValue(ufId, srcKey, candId);
                        let totalActiveWeight = 0; activeIds.forEach(cid => { totalActiveWeight += app.getMatrixValue(ufId, srcKey, cid); });
                        let finalFactor = 0; if(totalActiveWeight > 0) finalFactor = rawVal / totalActiveWeight;
                        sum += (votes22[srcKey] || 0) * finalFactor;
                    });
                    if(app.state.t1_mults[ufId] && app.state.t1_mults[ufId][candId]) sum *= app.state.t1_mults[ufId][candId];
                    zVotes[candId] = sum;
                });
                res.zonas[zId] = zVotes;
            }
            for(let zId in res.zonas) { for(let cid in res.zonas[zId]) { res.zonas[zId][cid] = Math.round(res.zonas[zId][cid] * corrections[cid]); } }
        }
        
        app.data.round1 = res; if (presentation.isActive) presentation.renderSlide();
    },
    calculateTurn2: () => {
        if(!app.data.round1) app.calculateTurn1(); const r1 = app.data.round1;
        const[id1, id2] = app.state.t2_finalists; if(!id1 || !id2) return;
        const isOrganic = app.state.t2_mode === 'organic';
        const res = { municipios: {}, estados: {}, nacional: {}, zonas: {} }; let tempNacional = {[id1]:0, [id2]:0}, grandTotal = 0;
        for(let ibge in r1.municipios) {
            const v1 = r1.municipios[ibge], ufId = ibge.substring(0,2); let vA = 0, vB = 0;
            for(let cid in v1) { const votos = v1[cid]; if(cid === id1) vA += votos; else if(cid === id2) vB += votos; else { let ratio = app.state.t2_migr[cid] !== undefined ? app.state.t2_migr[cid] : 0.5; vA += votos * (1 - ratio); vB += votos * ratio; } }
            if(app.state.t2_mults[ufId]) { if(app.state.t2_mults[ufId][id1]) vA *= app.state.t2_mults[ufId][id1]; if(app.state.t2_mults[ufId][id2]) vB *= app.state.t2_mults[ufId][id2]; }
            vA = Math.round(vA); vB = Math.round(vB); tempNacional[id1] += vA; tempNacional[id2] += vB; grandTotal += (vA + vB); res.municipios[ibge] = { [id1]: vA, [id2]: vB };
        }
        if(!isOrganic) {
            const totalSlider = (app.state.t2_polls[id1]||0) + (app.state.t2_polls[id2]||0); const targetPcts = {[id1]: (app.state.t2_polls[id1]||0)/(totalSlider||1),[id2]: (app.state.t2_polls[id2]||0)/(totalSlider||1) };
            const corrections = {};[id1, id2].forEach(id => { const currPct = tempNacional[id] / (grandTotal||1); corrections[id] = (app.state.t2_polls[id]<=0) ? 0 : (currPct>0 ? targetPcts[id]/currPct : 1); });
            res.nacional = {};
            for(let ibge in res.municipios) { const ufId = ibge.substring(0,2); if(!res.estados[ufId]) res.estados[ufId] = {};[id1, id2].forEach(id => { let v = Math.round(res.municipios[ibge][id] * corrections[id]); res.municipios[ibge][id] = v; res.estados[ufId][id] = (res.estados[ufId][id]||0) + v; res.nacional[id] = (res.nacional[id]||0) + v; }); }
        } else {
            res.nacional = tempNacional;
            for(let ibge in res.municipios) { const ufId = ibge.substring(0,2); if(!res.estados[ufId]) res.estados[ufId] = {};[id1, id2].forEach(id => { let v = res.municipios[ibge][id]; res.estados[ufId][id] = (res.estados[ufId][id]||0) + v; }); }
            const t = grandTotal || 1; app.state.t2_polls[id1] = Math.round((tempNacional[id1]/t)*100); app.state.t2_polls[id2] = Math.round((tempNacional[id2]/t)*100);
            if(document.getElementById(`val_t2_${id1}`)) document.getElementById(`val_t2_${id1}`).innerText = app.state.t2_polls[id1] + '%'; if(document.getElementById(`val_t2_${id2}`)) document.getElementById(`val_t2_${id2}`).innerText = app.state.t2_polls[id2] + '%'; app.checkT2Total();
        }

        if (r1.zonas) {
            for(let zId in r1.zonas) {
                const v1 = r1.zonas[zId], ufId = String(zId).substring(0,2); let vA = 0, vB = 0;
                for(let cid in v1) { const votos = v1[cid]; if(cid === id1) vA += votos; else if(cid === id2) vB += votos; else { let ratio = app.state.t2_migr[cid] !== undefined ? app.state.t2_migr[cid] : 0.5; vA += votos * (1 - ratio); vB += votos * ratio; } }
                if(app.state.t2_mults[ufId]) { if(app.state.t2_mults[ufId][id1]) vA *= app.state.t2_mults[ufId][id1]; if(app.state.t2_mults[ufId][id2]) vB *= app.state.t2_mults[ufId][id2]; }
                vA = Math.round(vA); vB = Math.round(vB); res.zonas[zId] = { [id1]: vA,[id2]: vB };
            }
            if(!isOrganic) {
                const totalSlider = (app.state.t2_polls[id1]||0) + (app.state.t2_polls[id2]||0); const targetPcts = { [id1]: (app.state.t2_polls[id1]||0)/(totalSlider||1), [id2]: (app.state.t2_polls[id2]||0)/(totalSlider||1) };
                const corrections = {};[id1, id2].forEach(id => { const currPct = tempNacional[id] / (grandTotal||1); corrections[id] = (app.state.t2_polls[id]<=0) ? 0 : (currPct>0 ? targetPcts[id]/currPct : 1); });
                for(let zId in res.zonas) { [id1, id2].forEach(id => { res.zonas[zId][id] = Math.round(res.zonas[zId][id] * corrections[id]); }); }
            }
        }
        app.data.round2 = res; if (presentation.isActive) presentation.renderSlide();
    },
    getVotes22: (obj, key) => { let sum = 0; for(let k in obj) { if(k.toUpperCase().includes(key)) sum += obj[k]; } return sum; }
};

document.addEventListener('DOMContentLoaded', app.init);
</script>
</body>
</html>
